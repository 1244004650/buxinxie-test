<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你是哪种不信邪的人？｜行动人格测试</title>
<style>
:root{--bg:#f5f0e6;--paper:#fffdf8;--ink:#262a24;--muted:#6e7168;--line:#ded7c9;--green:#526b4c;--blue:#476e8d;--yellow:#b4932f;--red:#a84d43}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.65}
main{max-width:820px;margin:0 auto;padding:24px 16px 56px}
header{background:var(--green);color:#fffdf5;padding:28px 24px;border-radius:18px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;opacity:.85}
h1{font-size:clamp(27px,5vw,40px);line-height:1.2;margin:10px 0}
header p{margin:8px 0 0;color:#e6e8dc}
.intro,.question,.result{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.intro{color:#45483f}
.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 2px 8px}
.progress{height:7px;background:#e4dfd4;border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.qtitle{font-weight:700;margin:0 0 12px}
.options{display:grid;gap:8px}
.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:11px 12px;border-radius:10px;cursor:pointer;background:#fffefa}
.option:has(input:checked){border-color:var(--green);background:#edf1e8}
.option input{margin-top:5px;accent-color:var(--green);flex-shrink:0}
.letter{font-weight:800;min-width:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:white}.secondary{background:#e6dfd2;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.notice{color:#8b4a34;background:#fff0e6;border:1px solid #f0d0bc;padding:12px;border-radius:10px;display:none}
.result{display:none}
.result h2{margin:0 0 4px}
.resulttype{display:inline-block;padding:5px 10px;border-radius:99px;background:#e9eee4;color:var(--green);font-weight:700;margin:8px 0}
.barrow{margin:12px 0}
.barhead{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar{height:9px;background:#e9e4da;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0}
.small{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);margin-top:20px}
@media(min-width:650px){.options{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">兰考调查档案 · 行动人格测试</div>
<h1>你是哪种不信邪的人？</h1>
<p>面对一个棘手的问题，你会怎么做？</p>
</header>
<section class="intro">
<strong>测试说明</strong><br>
请回想自己在真实生活中的反应，选择最像你平时会做的一项，而不是你认为最正确或最理想的答案。每题只能选一项。完成后查看你的行动倾向。
</section>
<div class="progressrow"><span id="progressText">已完成 0 / 12 题</span><span>每题单选</span></div>
<div class="progress"><span id="progressBar"></span></div>
<form id="quiz"></form>
<div class="notice" id="notice">还有题目没有作答。你可以补全后再查看完整结果。</div>
<div class="actions">
<button class="primary" type="button" id="submitBtn">查看我的行动人格</button>
<button class="secondary" type="button" id="resetBtn">重新测试</button>
</div>
<section class="result" id="result" aria-live="polite">
<div class="eyebrow">你的测试结果</div>
<h2 id="resultTitle"></h2>
<div id="resultTag" class="resulttype"></div>
<p id="resultDesc"></p>
<h3>四种行动倾向</h3>
<div id="scores"></div>
<p id="secondaryDesc"></p>
<button class="primary" type="button" id="copyBtn">复制测试结果</button>
<p class="small">说明：本测试是用于文创互动的自我探索问卷，借鉴人格类型的表达方式，不是经过心理测量学验证的标准化人格量表，也不能替代专业评估。</p>
</section>
<footer>「走出去 · 搞明白 · 再试试 · 不信邪」——不同的行动方式，可以汇成改变的力量。</footer>
</main>
<script>
const questions = [
["遇到一个从没接触过的陌生问题，你通常会先……",["找一个真实场景，亲自看看","搜集资料，弄清它的原理","先动手做个小尝试","检查大家默认的前提是否成立"]],
["小组项目陷入僵局，所有人都在争论，你会……",["去找相关的人或现场，获取一手信息","把争论拆成几个具体问题，逐项分析","提出一个小规模试验，先验证一条路","质疑大家是不是一开始就选错了方向"]],
["你第一次尝试某件事失败了，你最自然的反应是……",["换个场景或方法，重新接触问题","复盘原因，找出失败的关键变量","调整一个环节，再做一次","不接受失败就是能力上限，重新审视规则"]],
["有人告诉你：“这件事一直都做不到。”你会……",["去看看实际情况，确认难在哪里","问清楚过去尝试过什么、依据是什么","找一个更小的目标，先试着突破","追问：一直做不到，就代表永远做不到吗？"]],
["旅行时发现攻略上的路线行不通，你会……",["走到附近看看，寻找新的路线和线索","研究地图、交通规则和时间成本","先试一条可行的小路，不行再调整","重新判断原本的路线规划是不是有问题"]],
["当你接手一件复杂、没有现成答案的任务时，你最依赖……",["真实接触与现场观察","清晰的逻辑和可靠证据","不断试验、积累反馈","独立判断，不被惯例限制"]],
["你最受不了哪种工作状态？",["一直讨论，却没人去看真实情况","结论先行，证据和逻辑都不充分","明明有办法改进，却因为一次失败就放弃","只因为过去如此，就拒绝任何改变"]],
["你发现一个长期存在的小问题，你更可能……",["去了解真正受它影响的人和场景","追查问题为什么长期没有被解决","先做一个可行的小改动，看看效果","挑战维持现状的习惯或规定"]],
["别人评价你做事时，哪句话最可能让你觉得“说得对”？",["你总能发现别人没注意到的现场细节","你总能把复杂的事理出头绪","你总能从失败里调整出新办法","你不太会因为别人都这么想就跟着认同"]],
["面对一项耗时很长、短期看不到成果的任务，你会……",["持续接触实际情况，观察变化","建立判断标准，确认方向是否合理","拆成小阶段，边做边改","不断追问目标是否值得、旧办法是否需要推翻"]],
["如果你要帮助一个陷入困境的人，你最先想到的是……",["陪对方走进具体情境，看看真正的难处","一起分析问题的根源和限制条件","先做一件能改善现状的小事","看看对方是否被某个“只能这样”的想法困住"]],
["完成一件困难的事后，你最有成就感的时刻是……",["终于亲眼看见了此前不了解的真实情况","终于弄懂了事情背后的规律","终于把反复失败的方案做成了","终于证明原本被认为不可能的事可以改变"]]
];
const types = [
{name:"走出去",sub:"现场派",color:"#526b4c",desc:"你倾向于通过接触真实场景来理解问题。比起停留在猜测里，你更愿意迈出第一步，亲自寻找线索。"},
{name:"搞明白",sub:"追根派",color:"#476e8d",desc:"你倾向于先厘清原因和证据。比起接受现成解释，你更想找到能经得起推敲的答案。"},
{name:"再试试",sub:"实践派",color:"#b4932f",desc:"你倾向于在实践中不断修正。比起一次成功或失败，你更看重每次尝试带来的改进。"},
{name:"不信邪",sub:"破局派",color:"#a84d43",desc:"你倾向于独立判断并挑战惯性。比起接受“向来如此”，你更想知道这条边界究竟是否不可逾越。"}
];
const form=document.getElementById("quiz");
questions.forEach((q,i)=>{
 const section=document.createElement("section"); section.className="question";
 const title=document.createElement("p"); title.className="qtitle"; title.textContent=`${i+1}. ${q[0]}`; section.appendChild(title);
 const opts=document.createElement("div"); opts.className="options";
 q[1].forEach((txt,j)=>{
  const label=document.createElement("label"); label.className="option";
  const input=document.createElement("input"); input.type="radio"; input.name=`q${i}`; input.value=String(j);
  input.addEventListener("change",()=>{updateProgress();document.getElementById("result").style.display="none";});
  const letter=document.createElement("span"); letter.className="letter"; letter.textContent="ABCD"[j]+".";
  const text=document.createElement("span"); text.textContent=txt;
  label.append(input,letter,text); opts.appendChild(label);
 });
 section.appendChild(opts); form.appendChild(section);
});
function getAnswers(){return questions.map((_,i)=>{const el=form.querySelector(`input[name="q${i}"]:checked`);return el?Number(el.value):null;});}
function updateProgress(){const n=getAnswers().filter(x=>x!==null).length;document.getElementById("progressText").textContent=`已完成 ${n} / ${questions.length} 题`;document.getElementById("progressBar").style.width=`${n/questions.length*100}%`;}
document.getElementById("submitBtn").addEventListener("click",()=>{
 const answers=getAnswers(),count=answers.filter(x=>x!==null).length;
 const notice=document.getElementById("notice"); notice.style.display=count<questions.length?"block":"none";
 if(count===0){notice.textContent="请先回答至少一道题，再查看结果。";return;}
 if(count<questions.length)notice.textContent=`还有 ${questions.length-count} 题未作答。当前先显示已答题目的暂时结果。`;
 const scores=[0,0,0,0];answers.forEach(a=>{if(a!==null)scores[a]++;});
 const max=Math.max(...scores),winners=scores.map((s,i)=>s===max?i:-1).filter(i=>i>=0);
 const primary=winners[0],secondary= scores.map((s,i)=>({s,i})).filter(x=>x.i!==primary).sort((a,b)=>b.s-a.s)[0];
 document.getElementById("resultTitle").textContent=winners.length>1?winners.map(i=>types[i].name).join(" × "):types[primary].name;
 document.getElementById("resultTag").textContent=winners.length>1?"双主导倾向 · "+winners.map(i=>types[i].sub).join("＋"):types[primary].sub;
 document.getElementById("resultDesc").textContent=winners.map(i=>types[i].desc).join(" ");
 const scoresDiv=document.getElementById("scores");scoresDiv.innerHTML="";
 types.forEach((t,i)=>{const row=document.createElement("div");row.className="barrow";const head=document.createElement("div");head.className="barhead";const name=document.createElement("span");name.textContent=t.name+" · "+t.sub;const value=document.createElement("strong");value.textContent=scores[i]+" 分";head.append(name,value);const bar=document.createElement("div");bar.className="bar";const fill=document.createElement("div");fill.className="fill";fill.style.width=(scores[i]/Math.max(count,1)*100)+"%";fill.style.background=t.color;bar.appendChild(fill);row.append(head,bar);scoresDiv.appendChild(row);});
 document.getElementById("secondaryDesc").textContent=winners.length>1?"你的最高分出现并列，说明你可能会根据情境灵活切换行动方式。":`辅助倾向：${types[secondary.i].name}（${secondary.s} 分）。主导倾向代表你更自然的做法，辅助倾向则可能在特定情境中发挥作用。`;
 document.getElementById("result").style.display="block";document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("resetBtn").addEventListener("click",()=>{form.reset();document.getElementById("result").style.display="none";document.getElementById("notice").style.display="none";updateProgress();window.scrollTo({top:0,behavior:"smooth"});});
document.getElementById("copyBtn").addEventListener("click",async()=>{
 const scores=[0,0,0,0];getAnswers().forEach(a=>{if(a!==null)scores[a]++;});
 const text="《你是哪种不信邪的人？》测试结果\n"+types.map((t,i)=>`${t.name}：${scores[i]}分`).join("\n")+"\n答题数："+getAnswers().filter(x=>x!==null).length+"/12";
 try{await navigator.clipboard.writeText(text);document.getElementById("copyBtn").textContent="已复制！";}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();document.getElementById("copyBtn").textContent="已复制！";}
});
</script>
</body>
</html>
